name: Feature request
description: Propose a reusable collector, watchdog, integration, or safety improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed pattern
      description: Describe inputs, output, durable state, failure behavior, and verification.
    validations:
      required: true
  - type: dropdown
    id: side_effect
    attributes:
      label: Does it perform external writes?
      options:
        - No, read-only
        - Maybe; design discussion needed
        - Yes; explicit authorization and verification required
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a pull request.

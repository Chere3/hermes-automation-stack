<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Automation Stack</title>
  <desc id="desc">Signals flow through deterministic collectors and Hermes Agent into verified briefs and alerts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="42%">
      <stop offset="0" stop-color="#f5b942" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#253047" stroke-width="1" opacity=".36"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glow)"/>

  <g fill="none" stroke="#64748b" stroke-width="2" opacity=".8" marker-end="url(#arrow)">
    <path d="M275 162C395 162 410 235 500 235"/>
    <path d="M275 278H500"/>
    <path d="M275 394C395 394 410 325 500 325"/>
    <path d="M780 235C875 235 900 222 995 222"/>
    <path d="M780 325C875 325 900 338 995 338"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="70" y="112" width="205" height="100" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="102" cy="143" r="7" fill="#22d3ee"/>
      <text x="120" y="149" fill="#e2e8f0" font-size="18" font-weight="700">LOCAL SIGNALS</text>
      <text x="102" y="181" fill="#94a3b8" font-size="14">calendar · health · mail</text>
    </g>
    <g>
      <rect x="70" y="228" width="205" height="100" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="102" cy="259" r="7" fill="#a78bfa"/>
      <text x="120" y="265" fill="#e2e8f0" font-size="18" font-weight="700">OPERATIONS</text>
      <text x="102" y="297" fill="#94a3b8" font-size="14">finance · career · social</text>
    </g>
    <g>
      <rect x="70" y="344" width="205" height="100" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="102" cy="375" r="7" fill="#34d399"/>
      <text x="120" y="381" fill="#e2e8f0" font-size="18" font-weight="700">PUBLIC SOURCES</text>
      <text x="102" y="413" fill="#94a3b8" font-size="14">jobs · listings · feeds</text>
    </g>

    <g>
      <rect x="500" y="170" width="280" height="220" rx="24" fill="#131722" stroke="#f5b942" stroke-width="3"/>
      <circle cx="640" cy="246" r="42" fill="#f5b942"/>
      <path d="M620 246h40M640 226v40" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
      <text x="640" y="319" fill="#f8fafc" text-anchor="middle" font-size="28" font-weight="800">HERMES AGENT</text>
      <text x="640" y="349" fill="#f5b942" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2">REASON · VERIFY · ACT</text>
    </g>

    <g>
      <rect x="995" y="172" width="215" height="100" rx="16" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
      <circle cx="1027" cy="203" r="7" fill="#fb923c"/>
      <text x="1045" y="209" fill="#e2e8f0" font-size="18" font-weight="700">BRIEFS</text>
      <text x="1027" y="241" fill="#94a3b8" font-size="14">grounded · concise · dated</text>
    </g>
    <g>
      <rect x="995" y="288" width="215" height="100" rx="16" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
      <circle cx="1027" cy="319" r="7" fill="#fb7185"/>
      <text x="1045" y="325" fill="#e2e8f0" font-size="18" font-weight="700">ALERTS</text>
      <text x="1027" y="357" fill="#94a3b8" font-size="14">silent until actionable</text>
    </g>
  </g>

  <text x="640" y="70" fill="#f8fafc" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">SIGNALS → CONTEXT → VERIFIED ACTION</text>
  <text x="640" y="505" fill="#94a3b8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">deterministic collectors · durable state · exact targets · secret-free templates</text>
</svg>
